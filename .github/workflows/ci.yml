name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Put Homebrew on PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      # `brew style`/`brew audit` only accept formula names, so the checkout has
      # to be visible to Homebrew as a real tap.
      - name: Install the checkout as a tap
        run: |
          dest="$(brew --repository)/Library/Taps/zhurik/homebrew-tap"
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          cp -R "$GITHUB_WORKSPACE" "$dest"

      # Named formulae rather than the whole tap: `brew style <tap>` would also
      # impose Homebrew's internal shell style on scripts/, which shellcheck
      # covers below instead.
      - name: Style, audit, install and test every formula
        run: |
          for formula in Formula/*.rb; do
            name="zhurik/tap/$(basename "$formula" .rb)"
            brew style "$name"
            brew audit --strict --online "$name"
            brew install --formula "$name"
            brew test "$name"

            bin="$(jq -r .bin "meta/$(basename "$formula" .rb).json")"
            if jq -e .completions "meta/$(basename "$formula" .rb).json" >/dev/null; then
              test -s "$(brew --prefix "$name")/share/zsh/site-functions/_$bin"
              test -s "$(brew --prefix "$name")/etc/bash_completion.d/$bin"
            fi
          done

      - name: Lint the generator
        if: runner.os == 'Linux'
        run: shellcheck scripts/bump-formula.sh
